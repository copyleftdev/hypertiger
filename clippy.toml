too-many-lines-threshold = 70
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
disallowed-types = [
  { path = "f32", reason = "prices never pass through a float: use Px, Sz or Decimal" },
  { path = "f64", reason = "prices never pass through a float: use Px, Sz or Decimal" },
]
